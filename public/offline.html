<!doctype html>
<html lang="es-MX">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0b1020" />
        <meta name="color-scheme" content="dark" />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" href="/icons/aiven-icon.svg" type="image/svg+xml" />
        <title>Sin conexión - AIVEN</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #0b1020;
                color: #f8fafc;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 1.5rem;
                background:
                    radial-gradient(
                        circle at 80% 12%,
                        #6366f133,
                        transparent 34rem
                    ),
                    radial-gradient(
                        circle at 12% 88%,
                        #22d3ee1f,
                        transparent 30rem
                    ),
                    #0b1020;
            }

            main {
                width: min(100%, 34rem);
                padding: clamp(1.5rem, 6vw, 3rem);
                border: 1px solid #ffffff1f;
                border-radius: 1.5rem;
                background: #111831e6;
                box-shadow: 0 2rem 6rem #00000052;
                text-align: center;
            }

            img {
                width: 5rem;
                height: 5rem;
                margin-bottom: 1.25rem;
                border-radius: 1.25rem;
            }

            h1 {
                margin: 0;
                font-size: clamp(1.75rem, 8vw, 2.5rem);
                line-height: 1.1;
                letter-spacing: -0.04em;
            }

            p {
                margin: 1rem 0 0;
                color: #cbd5e1;
                line-height: 1.65;
            }

            .privacy {
                font-size: 0.875rem;
                color: #94a3b8;
            }

            a {
                display: inline-flex;
                min-height: 2.75rem;
                margin-top: 1.75rem;
                align-items: center;
                justify-content: center;
                border-radius: 0.75rem;
                padding: 0.75rem 1.25rem;
                background: linear-gradient(135deg, #6366f1, #22d3ee);
                color: #08101f;
                font-weight: 700;
                text-decoration: none;
            }

            a:focus-visible {
                outline: 3px solid #f8fafc;
                outline-offset: 4px;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/aiven-icon.svg" alt="" />
            <h1>Estás sin conexión</h1>
            <p>
                AIVEN no pudo conectarse. Revisa tu red y vuelve a intentarlo
                cuando tengas conexión.
            </p>
            <p class="privacy">
                Por seguridad, tus páginas privadas y datos personales no se
                guardan en el caché público.
            </p>
            <a href="/" rel="home">Volver a intentar</a>
        </main>
    </body>
</html>
